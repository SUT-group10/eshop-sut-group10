name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Backend quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22.14.0-npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-npm-

      - name: Record runtime
        run: |
          node --version
          npm --version
          printf 'Commit SHA: %s\n' "${GITHUB_SHA}"
          printf 'Runner OS: %s\n' "${RUNNER_OS}"

      - name: Install dependencies
        env:
          npm_config_build_from_source: "true"
        run: npm ci

      - name: Save npm cache
        if: ${{ !cancelled() && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Lint
        run: npm run lint

      - name: Build and syntax check
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Smoke tests
        run: npm run test:smoke

      - name: Generate coverage and Jest report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          npm run test:ci -- \
            --json \
            --outputFile=test-results/jest-report.json

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage/cobertura-coverage.xml
          disable_search: true
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload coverage and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-reports-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            backend/coverage/cobertura-coverage.xml
            backend/coverage/coverage-summary.json
            backend/test-results/jest-report.json
  # Khâu 1: Build Artifact thành Docker Image
  build_image:
    name: Build and Push Docker Image
    needs: quality
    # Chỉ build image khi code được push vào nhánh main (merge PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Gắn tag image theo tên dự án và mã SHA của commit để định danh tuyệt đối
          tags: ghcr.io/${{ github.repository_owner }}/eshop-backend:${{ github.sha }}, ghcr.io/${{ github.repository_owner }}/eshop-backend:latest
  # Khâu 2: Continuous Delivery - Triển khai lên Staging
  deploy_staging:
    name: Deploy to Staging VPS
    needs: build_image
    runs-on: ubuntu-22.04
    environment: staging

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Server tự đăng nhập vào GHCR (dùng chính token của luồng chạy)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Tải Image bất biến vừa được build
            IMAGE_URL="ghcr.io/${{ github.repository_owner }}/eshop-backend:${{ github.sha }}"
            docker pull $IMAGE_URL
            
            # 3. Chuyển đổi trạng thái Container (Zero-downtime cơ bản)
            docker stop eshop-backend-staging || true
            docker rm eshop-backend-staging || true
            
            # 4. Khởi động lại hệ thống với cấu hình nạp từ GitHub Secrets
            docker run -d \
              --name eshop-backend-staging \
              --restart unless-stopped \
              -p 8080:8080 \
              -e NODE_ENV="staging" \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              $IMAGE_URL
              
            # 5. Dọn dẹp cache image cũ để giải phóng dung lượng ổ cứng
            docker image prune -af