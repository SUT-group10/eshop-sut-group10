name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Backend quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22.14.0-npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.14.0-npm-

      - name: Record runtime
        run: |
          node --version
          npm --version
          printf 'Commit SHA: %s\n' "${GITHUB_SHA}"
          printf 'Runner OS: %s\n' "${RUNNER_OS}"

      - name: Install dependencies
        env:
          npm_config_build_from_source: "true"
        run: npm ci

      - name: Save npm cache
        if: ${{ !cancelled() && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Lint
        run: npm run lint

      - name: Build and syntax check
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      - name: Smoke tests
        run: npm run test:smoke

      - name: Generate coverage and Jest report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results
          npm run test:ci -- \
            --json \
            --outputFile=test-results/jest-report.json

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: backend/coverage/cobertura-coverage.xml
          disable_search: true
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload coverage and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-reports-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            backend/coverage/cobertura-coverage.xml
            backend/coverage/coverage-summary.json
            backend/test-results/jest-report.json
  # Khâu 1: Build Artifact thành Docker Image
  build_image:
    name: Build and Push Docker Image
    needs: quality
    # Chỉ build image khi code được push vào nhánh main (merge PR)
    if: github.event_name == 'pull_request' # && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
         
      - name: Set lowercase repository owner
       # Đặt ID để các step sau có thể gọi chính xác đầu ra của step này
        id: format_owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Gọi lại giá trị owner_lc từ output của step có id là format_owner
          tags: ghcr.io/${{ steps.format_owner.outputs.owner_lc }}/eshop-backend:${{ github.sha }}, ghcr.io/${{ steps.format_owner.outputs.owner_lc }}/eshop-backend:latest
  # Khâu 2: Continuous Delivery - Triển khai lên Staging
  deploy_staging:
    name: Deploy to Local Windows Runner
    needs: build_image
    # Rất quan trọng: Trỏ trực tiếp về Self-hosted runner (máy Windows của bạn)
    runs-on: self-hosted
    environment: staging

    steps:
      - name: Log in to GitHub Container Registry
        shell: pwsh
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and Run Docker Container on Windows
        shell: pwsh
        run: |
          # 1. Xử lý lỗi chữ hoa/thường: Chuyển đổi tên owner sang chữ thường bằng PowerShell
          $OWNER_LC = "${{ github.repository_owner }}".ToLower()
          
          # 2. Cập nhật lại biến IMAGE_URL với chuỗi đã được viết thường
          $IMAGE_URL = "ghcr.io/$OWNER_LC/eshop-backend:${{ github.sha }}"
          
          # Tải Image mới nhất từ GHCR về Docker Desktop
          docker pull $IMAGE_URL
          
          # Dừng và xóa container cũ (2>$null giúp PowerShell bỏ qua lỗi nếu container chưa tồn tại)
          docker stop eshop-backend-staging 2>$null
          docker rm eshop-backend-staging 2>$null
          
          # Khởi chạy container mới (dùng dấu ` để xuống dòng trong PowerShell)
          # Lưu ý: Port backend EShop mặc định là 3000
          docker run -d `
            --name eshop-backend-staging `
            --restart unless-stopped `
            -p 3000:3000 `
            -e NODE_ENV="staging" `
            -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" `
            $IMAGE_URL
            
          # Dọn dẹp image cũ để tránh đầy ổ cứng
          docker image prune -af